## 📌 PR 제목
`[Feat] 사용처(Place) 도메인 구현 및 도메인별 에러코드 추가`

## 📖 작업 배경
지원금을 사용할 수 있는 대피소, 가맹점, 약국 등의 장소를 관리하기 위해 `place` 도메인을 구현했습니다.

또한 기존에 구현된 공통 예외처리 구조(`CustomException`, `ErrorCode`)를 활용하여 사용처 도메인에서 발생할 수 있는 예외를 처리하도록 구성했습니다.

## 🛠️ 작업 내용

### 1. Place 도메인 구현
- `domain/place/{controller, service, repository, entity, dto}` 패키지 구성
- DTO를 `request`, `response`로 분리
- `Place` 엔티티 및 `PlaceCategory`, `PlaceStatus` Enum 구현
- `PlaceProduct` 엔티티 구현
- 사용처별 상품 목록 관리 기능 구현
- 동일 사용처 내 상품명 중복 등록 방지
- 재고 수량 관리 기능 제외

### 2. 사용처 API 구현
- `GET /places` : 사용처 목록 조회
  - 카테고리, 지역, 키워드, 상품명, 운영 상태 필터링
  - 페이지네이션 적용
- `GET /places/{placeId}` : 사용처 상세 조회
- `POST /places` : 사용처 등록
- `PATCH /places/{placeId}/status` : 사용처 운영 상태 변경
- `POST /places/{placeId}/products` : 상품 추가
- `DELETE /places/{placeId}/products/{productId}` : 상품 삭제

### 3. 공통 예외처리 연동 및 도메인별 에러코드 추가
기존 공통 예외처리 구조를 활용하여 Place 도메인에서 발생하는 예외를 처리하도록 구현했습니다.

추가한 에러코드:
- `PLACE_NOT_FOUND` : 사용처를 찾을 수 없음
- `PLACE_UNAVAILABLE` : 이용할 수 없는 사용처
- `PRODUCT_NOT_FOUND` : 상품을 찾을 수 없음
- `PRODUCT_ALREADY_EXISTS` : 이미 등록된 상품

- `CustomException`을 통한 도메인 예외 발생
- `ErrorCode`를 통한 에러 코드 및 HTTP 상태 관리
- 다른 도메인에서도 사용처의 이용 가능 여부를 검증할 수 있도록 `getUsablePlace()` 제공

