openapi: 3.0.3
info:
  title: DaonPay API
  description: 다온페이 재난지원금 안내·신청·지갑·결제 서비스 API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Local development server

tags:
  - name: User
    description: 회원
  - name: Disaster
    description: 재난 정보
  - name: SupportProgram
    description: 재난지원 및 정부 지원사업
  - name: Matching
    description: AI 기반 지원사업 매칭
  - name: Application
    description: 지원금 신청
  - name: Wallet
    description: 다온페이 지갑 및 거래
  - name: Payment
    description: 결제
  - name: Merchant
    description: 가맹점
  - name: Notification
    description: 알림

security:
  - bearerAuth: []

paths:
  /users/signup:
    post:
      tags: [User]
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/login:
    post:
      tags: [User]
      summary: 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags: [User]
      summary: 내 정보 조회
      responses:
        '200':
          description: 사용자 정보 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /disasters:
    get:
      tags: [Disaster]
      summary: 재난 목록 조회
      parameters:
        - in: query
          name: disasterType
          schema:
            type: string
          description: 재난 유형 필터
        - in: query
          name: status
          schema:
            type: string
            enum: [ONGOING, ENDED]
          description: 재난 진행 상태
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 재난 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisasterPage'

  /disasters/{disasterId}:
    get:
      tags: [Disaster]
      summary: 재난 상세 조회
      parameters:
        - $ref: '#/components/parameters/DisasterId'
      responses:
        '200':
          description: 재난 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disaster'
        '404':
          $ref: '#/components/responses/NotFound'

  /support-programs:
    get:
      tags: [SupportProgram]
      summary: 재난지원사업 목록 조회
      parameters:
        - in: query
          name: disasterId
          schema:
            type: integer
            format: int64
        - in: query
          name: keyword
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 재난지원사업 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportProgramPage'

  /support-programs/{programId}:
    get:
      tags: [SupportProgram]
      summary: 재난지원사업 상세 조회
      parameters:
        - $ref: '#/components/parameters/ProgramId'
      responses:
        '200':
          description: 재난지원사업 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportProgramDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /support-programs/{programId}/eligibility:
    get:
      tags: [SupportProgram]
      summary: 재난지원사업 자격 조건 조회
      parameters:
        - $ref: '#/components/parameters/ProgramId'
      responses:
        '200':
          description: 자격 조건 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  programId:
                    type: integer
                    format: int64
                  eligibility:
                    type: array
                    items:
                      $ref: '#/components/schemas/Eligibility'

  /matches:
    post:
      tags: [Matching]
      summary: 내 지원금 매칭 요청
      description: 입력된 피해 정보와 지원사업 자격 조건을 비교해 신청 가능성이 있는 사업을 추천합니다. 최종 자격 판정이나 지급 승인을 의미하지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchRequest'
      responses:
        '200':
          description: 매칭 결과 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /matches/me:
    get:
      tags: [Matching]
      summary: 내 매칭 결과 조회
      responses:
        '200':
          description: 매칭 결과 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      $ref: '#/components/schemas/MatchItem'

  /applications:
    post:
      tags: [Application]
      summary: 재난 지원금 신청
      description: 로그인한 사용자가 지원사업을 신청합니다. <br> 실제 제출 서류의 저장 및 검증 절차는 별도 구현이 필요합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
      responses:
        '201':
          description: 신청 접수 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /applications/me:
    get:
      tags: [Application]
      summary: 내 신청 목록 조회
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, REVIEWING, APPROVED, REJECTED, CANCELED]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 신청 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'

  /applications/{applicationId}:
    get:
      tags: [Application]
      summary: 신청 상세 조회
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: 신청 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /applications/{applicationId}/cancel:
    patch:
      tags: [Application]
      summary: 지원금 신청 취소
      description: 취소 가능 상태인 신청만 취소할 수 있도록 서버에서 검증해야 합니다.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: 신청 취소 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /wallets/me:
    get:
      tags: [Wallet]
      summary: 내 지갑 조회
      responses:
        '200':
          description: 지갑 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'

  /wallets/me/transactions:
    get:
      tags: [Wallet]
      summary: 내 지갑 거래 내역 조회
      parameters:
        - in: query
          name: transactionType
          schema:
            type: string
            enum: [SUPPORT_PAYMENT, PAYMENT, REFUND, ADJUSTMENT]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 거래 내역 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'

  /payments:
    post:
      tags: [Payment]
      summary: 결제 요청
      description: 결제 가능 잔액, 지원금 사용 조건, 가맹점 상태를 서버에서 검증한 뒤 처리해야 합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
      responses:
        '201':
          description: 결제 처리 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /payments/me:
    get:
      tags: [Payment]
      summary: 내 결제 내역 조회
      parameters:
        - in: query
          name: paymentStatus
          schema:
            type: string
            enum: [COMPLETED, CANCELED, FAILED]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 결제 내역 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'

  /payments/{paymentId}:
    get:
      tags: [Payment]
      summary: 결제 상세 조회
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: 결제 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /merchants:
    get:
      tags: [Merchant]
      summary: 가맹점 목록 조회
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: region
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 가맹점 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantPage'

  /merchants/{merchantId}:
    get:
      tags: [Merchant]
      summary: 가맹점 상세 조회
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      responses:
        '200':
          description: 가맹점 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/me:
    get:
      tags: [Notification]
      summary: 내 알림 목록 조회
      parameters:
        - in: query
          name: isRead
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 알림 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'

  /notifications/{notificationId}/read:
    patch:
      tags: [Notification]
      summary: 알림 읽음 처리
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: 읽음 처리 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  notificationId:
                    type: integer
                    format: int64
                  isRead:
                    type: boolean
                    example: true
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/read-all:
    patch:
      tags: [Notification]
      summary: 전체 알림 읽음 처리
      responses:
        '200':
          description: 전체 읽음 처리 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedCount:
                    type: integer
                    example: 5

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      in: query
      name: page
      description: 페이지 번호 (0부터 시작)
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      in: query
      name: size
      description: 페이지당 데이터 개수
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DisasterId:
      in: path
      name: disasterId
      required: true
      schema:
        type: integer
        format: int64
    ProgramId:
      in: path
      name: programId
      required: true
      schema:
        type: integer
        format: int64
    ApplicationId:
      in: path
      name: applicationId
      required: true
      schema:
        type: integer
        format: int64
    PaymentId:
      in: path
      name: paymentId
      required: true
      schema:
        type: integer
        format: int64
    MerchantId:
      in: path
      name: merchantId
      required: true
      schema:
        type: integer
        format: int64
    NotificationId:
      in: path
      name: notificationId
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 인증 실패 또는 인증 정보 누락
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 접근 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 요청한 데이터 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 중복 또는 상태 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SignupRequest:
      type: object
      required: [email, password, name, phone]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: password123!
        name:
          type: string
          example: 홍길동
        phone:
          type: string
          example: "01012345678"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: password123!

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer

    UserResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          example: user@example.com
        name:
          type: string
          example: 홍길동
        phone:
          type: string
          example: "01012345678"

    Disaster:
      type: object
      properties:
        disasterId:
          type: integer
          format: int64
        disasterName:
          type: string
          example: 집중호우
        disasterType:
          type: string
          example: FLOOD
        description:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [ONGOING, ENDED]

    DisasterPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Disaster'

    SupportProgram:
      type: object
      properties:
        programId:
          type: integer
          format: int64
        programName:
          type: string
          example: 침수 피해 긴급 생활지원금
        disasterId:
          type: integer
          format: int64
        organization:
          type: string
          example: 지자체
        supportAmount:
          type: number
          format: double
          example: 1000000
        applicationStart:
          type: string
          format: date-time
        applicationEnd:
          type: string
          format: date-time
        description:
          type: string
        sourceUrl:
          type: string
          format: uri

    SupportProgramDetail:
      allOf:
        - $ref: '#/components/schemas/SupportProgram'
        - type: object
          properties:
            eligibility:
              type: array
              items:
                $ref: '#/components/schemas/Eligibility'

    SupportProgramPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/SupportProgram'

    Eligibility:
      type: object
      properties:
        eligibilityId:
          type: integer
          format: int64
        conditionType:
          type: string
          example: REGION
        conditionValue:
          type: string
          example: 경상북도
        description:
          type: string
          example: 해당 지역 거주자

    MatchRequest:
      type: object
      required: [region, damageType]
      properties:
        region:
          type: string
          example: 경상북도
        damageType:
          type: string
          example: FLOOD
        additionalInfo:
          type: string
          example: 주택 침수 피해

    MatchItem:
      type: object
      properties:
        matchId:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        programName:
          type: string
        matchStatus:
          type: string
          enum: [POTENTIAL_MATCH, NOT_MATCHED, NEEDS_REVIEW]
        matchReason:
          type: string
        matchedAt:
          type: string
          format: date-time

    MatchResponse:
      type: object
      properties:
        matchId:
          type: integer
          format: int64
        matchedPrograms:
          type: array
          items:
            $ref: '#/components/schemas/MatchItem'
        matchedAt:
          type: string
          format: date-time

    ApplicationDocumentRequest:
      type: object
      required: [documentName, documentUrl]
      properties:
        documentName:
          type: string
          example: 피해사실확인서
        documentUrl:
          type: string
          format: uri

    ApplicationCreateRequest:
      type: object
      required: [programId]
      properties:
        programId:
          type: integer
          format: int64
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationDocumentRequest'

    ApplicationResponse:
      type: object
      properties:
        applicationId:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        applicationStatus:
          type: string
          enum: [PENDING, REVIEWING, APPROVED, REJECTED, CANCELED]
        appliedAt:
          type: string
          format: date-time

    ApplicationDocument:
      type: object
      properties:
        documentId:
          type: integer
          format: int64
        documentName:
          type: string
        documentStatus:
          type: string
          enum: [PENDING, SUBMITTED, VERIFIED, REJECTED]

    ApplicationDetail:
      allOf:
        - $ref: '#/components/schemas/ApplicationResponse'
        - type: object
          properties:
            programName:
              type: string
            reviewedAt:
              type: string
              format: date-time
              nullable: true
            rejectionReason:
              type: string
              nullable: true
            documents:
              type: array
              items:
                $ref: '#/components/schemas/ApplicationDocument'

    ApplicationListItem:
      allOf:
        - $ref: '#/components/schemas/ApplicationResponse'
        - type: object
          properties:
            programName:
              type: string

    ApplicationPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ApplicationListItem'

    WalletResponse:
      type: object
      properties:
        walletId:
          type: integer
          format: int64
        balance:
          type: number
          format: double
          example: 1000000
        createdAt:
          type: string
          format: date-time

    Transaction:
      type: object
      properties:
        transactionId:
          type: integer
          format: int64
        transactionType:
          type: string
          enum: [SUPPORT_PAYMENT, PAYMENT, REFUND, ADJUSTMENT]
        amount:
          type: number
          format: double
        balanceAfter:
          type: number
          format: double
        relatedApplicationId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time

    TransactionPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'

    PaymentCreateRequest:
      type: object
      required: [merchantId, amount, paymentMethod]
      properties:
        merchantId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
          minimum: 1
          example: 30000
        paymentMethod:
          type: string
          enum: [QR, CARD]

    PaymentResponse:
      type: object
      properties:
        paymentId:
          type: integer
          format: int64
        merchantId:
          type: integer
          format: int64
        merchantName:
          type: string
        amount:
          type: number
          format: double
        paymentMethod:
          type: string
          enum: [QR, CARD]
        paymentStatus:
          type: string
          enum: [COMPLETED, CANCELED, FAILED]
        paidAt:
          type: string
          format: date-time

    PaymentListItem:
      allOf:
        - $ref: '#/components/schemas/PaymentResponse'

    PaymentPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/PaymentListItem'

    Merchant:
      type: object
      properties:
        merchantId:
          type: integer
          format: int64
        merchantName:
          type: string
          example: 행복마트
        businessType:
          type: string
          example: MART
        address:
          type: string
        isActive:
          type: boolean

    MerchantPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Merchant'

    Notification:
      type: object
      properties:
        notificationId:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Notification'

    PageMetadata:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: 잘못된 요청입니다.
